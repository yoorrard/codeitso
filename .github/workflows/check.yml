# 모든 푸시와 PR에서 자료·엔진·화면 검사를 돌린다. 배포는 T21에서 따로 만든다.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 자료·골든·토큰·글꼴·품질 바닥선·하네스·타입 검사와 단위 시험
        run: npm run check
      - name: 엔진 시험 범위
        run: npm run test:coverage
      - name: 빌드
        run: npm run build
      - name: 성능 예산
        run: npm run qa:budget
