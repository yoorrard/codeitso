# 모든 푸시와 PR에서 자료·엔진·화면 검사를 돌린다. 배포는 T21에서 따로 만든다.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

# 도구의 사용 통계 보내기를 끈다 (추적 없음 원칙)
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 자료·골든·토큰·글꼴·품질 바닥선·하네스·타입 검사와 단위 시험
        run: npm run check
      - name: 엔진 시험 범위
        run: npm run test:coverage
      - name: 빌드
        run: npm run build
      - name: 성능 예산
        run: npm run qa:budget
      - name: e2e 브라우저 설치 (Chromium, Playwright 1.56.1)
        run: npx playwright install --with-deps chromium
      - name: e2e (주요 흐름·검색·모션·axe 접근성)
        run: npm run e2e
      - name: e2e 실패 기록
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .qa/e2e-results
          retention-days: 7
