# 자료·화면 검사. 비공개 저장소는 GitHub Actions 무료 시간이 월 2,000분이라(공개는 무료) 아껴 쓴다 (D72):
#   main 푸시·PR·수동 실행 → 전체(검사·빌드·예산·e2e·주소 바탕, 약 4분) / 작업 브랜치 푸시 → 빠른 검사(검사·빌드·예산, 약 1.5분)
#   같은 브랜치에 새로 푸시하면 앞의 실행은 취소한다. 배포는 Cloudflare Workers Builds가 한다 (docs/DEPLOY.md).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 도구의 사용 통계 보내기를 끈다 (추적 없음 원칙)
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 토큰·글꼴·품질 바닥선·쓰지 않는 말·하네스·타입 검사와 단위 시험 (진열대 자료 스키마 포함)
        run: npm run check
      - name: 빌드
        run: npm run build
      - name: 성능 예산
        run: npm run qa:budget
      - name: e2e 브라우저 설치 (Chromium, Playwright 1.56.1)
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      - name: e2e (주요 흐름·검색·모션·axe 접근성)
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: npm run e2e
      - name: 주소 바탕 (하위 주소 빌드 검사 + e2e, 설계서 9.4절)
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: npm run e2e:base
      - name: e2e 실패 기록
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .qa/e2e-results
          retention-days: 7
