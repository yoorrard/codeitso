# 매일 자료 새로 받기 (v5.1 P4, 소유자 요청 8, D128): 모든 출처를 다시 받고, 새 상품의 README 그림과 한국어 설명을 더한 뒤
# 단위 시험(자료 개수·스키마 포함)과 진열대 빌드가 통과하면 배포 가지에 올린다. 그 푸시를 Cloudflare Workers Builds가 배포한다.
# - 시각: 매일 03:17 KST(18:17 UTC). GitHub 예약 실행은 기본 가지(main)에 있는 이 파일로만 돈다 (docs/HUMAN.md H24).
# - 배포 가지: 저장소 변수 DEPLOY_BRANCH (없으면 claude/focused-bell-a92t1m).
# - 번역: OpenAI 호환 주소를 저장소 변수 TRANSLATE_API_URL·TRANSLATE_MODEL, 비밀 값 TRANSLATE_API_KEY로 주면 돈다. 없으면 건너뛴다.
#   (GitHub Models는 2026-07-30에 닫혀 쓸 수 없다.) 한 번에 번역할 수는 TRANSLATE_BUDGET(기본 200).
# - 시간: 가져오기를 16줄로 나눠 함께 돌린다(scripts/import/refresh-all.ts). 느리고 잘 바뀌지 않는 출처(공공데이터포털 두 목록·Iconify 묶음 전체·OWID·MCP 등록소)는
#   월요일(KST)에만 받는다. 비공개 저장소의 Actions 무료 시간(월 2,000분) 안에 들도록 매일 약 18분, 월요일 약 60분을 어림한다.
# - GITHUB_TOKEN으로 한 푸시는 다른 작업 흐름(check)을 다시 띄우지 않는다.
name: daily-refresh

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      translate_budget:
        description: 이번에 번역할 최대 상품 수 (0이면 번역하지 않음)
        required: false
        default: '200'
      groups:
        description: 받을 갈래 (비우면 모두. 예 design api)
        required: false
        default: ''
      all:
        description: 주간 몫(공공데이터포털·Iconify·OWID·MCP 등록소)까지 받기
        type: boolean
        default: false
  # 이 파일을 고쳐 올리면 한 번 돌려 본다
  push:
    paths:
      - .github/workflows/daily-refresh.yml

permissions:
  contents: write

# 새 실행이 앞 실행을 멈춘다 (앞 실행은 아직 아무것도 올리지 않았거나, 올렸다면 새 실행이 그 위에서 다시 받는다)
concurrency:
  group: daily-refresh
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'claude/focused-bell-a92t1m' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 자료 다시 받기 (디자인·AI·API·오픈소스, 16줄을 함께)
        run: node scripts/import/refresh-all.ts $GROUPS
        env:
          GROUPS: ${{ github.event.inputs.groups }}
          REFRESH_ALL: ${{ github.event.inputs.all == 'true' && '1' || '' }}
          # 토큰은 주제 검색 줄(oss·tpl)에만 넘긴다 (refresh-all.ts). 주제마다 별 많은 순 500개까지
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOPIC_PAGES: '5'
      - name: 새 상품의 README 첫 그림
        continue-on-error: true
        run: node scripts/import/media-readme.ts
      - name: 한국어 설명 (자료로 만드는 한 줄)
        run: node scripts/i18n/template-ko.ts
      - name: 한국어 설명 (번역, 열쇠가 있을 때만)
        continue-on-error: true
        run: node scripts/i18n/translate.ts
        env:
          TRANSLATE_API_URL: ${{ vars.TRANSLATE_API_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_BUDGET: ${{ github.event.inputs.translate_budget || vars.TRANSLATE_BUDGET || '200' }}
          TRANSLATE_RPM: ${{ vars.TRANSLATE_RPM || '10' }}
      - name: 단위 시험 (자료 개수·스키마·진열대 계산)
        run: npm test
      - name: 진열대 빌드 확인
        run: npm run catalog
      - name: 바뀐 자료 올리기
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 자료가 없어 올리지 않는다."
            exit 0
          fi
          stat=$(git diff --cached --shortstat)
          git commit -q -m "자료 매일 새로 받기 $(TZ=Asia/Seoul date +%F)" -m "$stat"
          for i in 1 2 3; do
            if git pull -q --rebase origin "$DEPLOY_BRANCH" && git push -q origin "HEAD:$DEPLOY_BRANCH"; then
              echo "올렸다: $stat"
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "::error::배포 가지 $DEPLOY_BRANCH에 올리지 못했다."
          exit 1
